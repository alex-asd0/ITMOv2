<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Макет — Менеджер задач</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <h1>Менеджер задач</h1>
        <div class="topbar-actions">
          <span class="spins-indicator" title="Оставшиеся крутки">Крутки: <b id="spins-count">5</b></span>
          <button id="play-button" class="btn play" aria-label="Играть в колесо фортуны">ИГРАТЬ</button>
        </div>
      </div>

      <nav class="view-switch" aria-label="Режим просмотра">
        <button id="view-list" class="btn toggle" aria-pressed="true">Список</button>
        <button id="view-calendar" class="btn toggle" aria-pressed="false">Календарь недели</button>
      </nav>

      <form id="new-task-form" class="new-task">
        <input id="new-task-input" type="text" placeholder="Новая задача" aria-label="Новая задача" />
        <select id="new-time-mode" aria-label="Режим времени">
          <option value="none" selected>Без времени</option>
          <option value="all_day">На весь день</option>
          <option value="when">Точка во времени</option>
          <option value="timed">Интервал</option>
        </select>
        <div class="emoji-control">
          <button type="button" id="new-emoji-btn" class="btn" aria-expanded="false" aria-controls="new-emoji-panel">Добавить эмодзи</button>
          <div id="new-emoji-panel" class="emoji-panel" hidden></div>
        </div>
        <button type="submit" class="btn primary">Добавить</button>
      </form>

      <section id="list-view">
        <ul id="task-list" class="tasks"></ul>
      </section>

      <section id="calendar-view" hidden>
        <header class="cal-header">
          <button class="btn">Предыдущая</button>
          <button class="btn">Эта неделя</button>
          <button class="btn">Следующая</button>
          <span class="cal-title">16 – 22 ноября 2026</span>
        </header>
        <div id="calendar" class="calendar"></div>
        <h2 class="no-time-title">Без времени</h2>
        <ul id="no-time-list" class="tasks no-time"></ul>
      </section>

      <div id="edit-modal" class="modal" hidden>
        <div class="modal-content">
          <h2>Редактирование задачи</h2>
          <form id="edit-form">
            <label>Название <input id="edit-title" type="text" /></label>
            <label>
              Режим времени
              <select>
                <option>Без времени</option>
                <option>На весь день</option>
                <option>Точка во времени</option>
                <option>Интервал</option>
              </select>
            </label>
            <div class="edit-emoji">
              <div class="emoji-chips" id="edit-emoji-chips"></div>
              <div class="emoji-control">
                <button type="button" id="edit-emoji-btn" class="btn">Добавить ещё эмодзи</button>
                <div id="edit-emoji-panel" class="emoji-panel" hidden></div>
              </div>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn danger" data-close="edit-modal">Удалить</button>
              <button type="button" class="btn primary" data-close="edit-modal">Сохранить</button>
              <button type="button" class="btn" data-close="edit-modal">Отмена</button>
            </div>
          </form>
        </div>
      </div>

      <div id="spins-banner" class="overlay" role="dialog" aria-modal="true" aria-labelledby="spins-banner-title" hidden>
        <div class="overlay-content">
          <h2 id="spins-banner-title">Лимит круток исчерпан</h2>
          <p>Чтобы продлить лимит — переведите деньги на наш b2c стартап. Возвращайтесь после полуночи по вашему времени.</p>
          <button class="btn primary" data-close="spins-banner">Понятно</button>
        </div>
      </div>

      <div id="wheel-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="wheel-title" hidden>
        <div class="overlay-content wheel-modal">
          <div class="wheel-header">
            <h2 id="wheel-title">Колесо фортуны</h2>
            <button class="btn" data-close="wheel-overlay" aria-label="Закрыть">Закрыть</button>
          </div>
          <div class="wheel-wrap">
            <div class="wheel-pointer" aria-hidden="true"></div>
            <div id="wheel" class="wheel" aria-label="Колесо со списком призов"></div>
            <button id="wheel-spin" class="btn primary wheel-center">КРУТИТЬ</button>
          </div>
          <div id="wheel-result" class="wheel-result" aria-live="polite"></div>
          <ul id="wheel-legend" class="wheel-legend"></ul>
        </div>
      </div>
    </main>

    <nav class="mock-nav" aria-label="Состояния макета">
      <span>Макет:</span>
      <button data-state="list">Список</button>
      <button data-state="calendar">Календарь</button>
      <button data-state="emoji">Выбор эмодзи</button>
      <button data-state="edit">Редактирование</button>
      <button data-state="wheel">Колесо</button>
      <button data-state="banner">Лимит круток</button>
    </nav>

    <script src="mock.js"></script>
  </body>
</html>
